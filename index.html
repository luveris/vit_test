function calculate(){
    const groups = new Set();

    document
        .querySelectorAll('input[type="radio"]')
        .forEach(r => groups.add(r.name));

    let hasMissed = false;
    let firstMissedRow = null;

    for(const name of groups){
        const checked = document.querySelector(`input[name="${name}"]:checked`);
        
        if(!checked){
            hasMissed = true;
            const missedInput = document.querySelector(`input[name="${name}"]`);
            const missedRow = missedInput.closest("tr");
            
            if(!firstMissedRow) {
                firstMissedRow = missedRow;
            }
            
            missedRow.style.backgroundColor = "#ffebee";
        }
    }

    if(hasMissed){
        alert("Пожалуйста, ответьте на все вопросы теста. Пропущенные строки подсвечены красным.");
        if(firstMissedRow) {
            firstMissedRow.scrollIntoView({ behavior: "smooth", block: "center" });
        }
        return;
    }

    let html = "<h2>📋 Ваши результаты</h2><div id='results-content' class='results-list'>";

    tests.forEach(t=>{
        let sum = 0;
        let radios = document.querySelectorAll(`input[name^="${t[2]}"]:checked`);
        radios.forEach(r => sum += parseInt(r.value));

        let status, cssClass, message;
        const nutrientName = t[0];
        const [normalMax, warningMax] = thresholds[nutrientName];
        const advice = nutrientAdvice[nutrientName];

        if(sum <= normalMax){
            status = "Норма";
            cssClass = "normal";
            message = `Похоже, что <strong>${nutrientName}</strong> в норме - продолжайте держать в своем рационе ${advice}`;
        }
        else if(sum <= warningMax){
            status = "Возможный дефицит";
            cssClass = "warning";
            message = `Возможно, в вашей тарелке временно в дефиците <strong>${nutrientName}</strong> (его может слегка не хватать). Понаблюдайте за собой ещё пару недель и обратите внимание на рацион: ${advice}`;
        }
        else{
            status = "Предполагаемый дефицит";
            cssClass = "danger";
            message = `По вашим ответам похоже, что <strong>${nutrientName}</strong> в глубоком дефиците. Это стоит обсудить отдельно - самостоятельно скорректировать рацион тут может быть недостаточно.`;
        }

        html += `
        <div class="result-item ${cssClass}">
            <div style="margin-bottom: 8px; font-size: 16px;">
                <strong>${nutrientName}</strong> <span style="opacity:0.8;">- ${sum} баллов (${status})</span>
            </div>
            <div>${message}</div>
        </div>`;
    });

    html += "</div>";

    html += `
    <div class="cta-block">
        <h3>Хотите разобраться точнее?</h3>
        <p>Тест - это только ориентир, он показывает направление, но не заменяет полноценную диагностику. Если хотите разобраться точнее - что из этого действительно требует внимания, а что не критично - приходите на консультацию. Соберём полную картину и составим план именно под ваш организм.</p>
        <a href="https://t.me/krasnoe_polusladkoye" target="_blank" class="cta-btn">Записаться на консультацию</a>
    </div>
    `;

    const resBlock = document.getElementById("results");
    resBlock.innerHTML = html;
    resBlock.style.display = "block";

    window.scrollTo({
        top: resBlock.offsetTop - 20,
        behavior: "smooth"
    });
}

</script>

</body>
</html>
